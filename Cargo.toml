[package]
name = "aion-state"
version = "0.1.0"
edition = "2024"

[dependencies]
parking_lot = "0.12.5"
tracing = "0.1.44"
thiserror = "2.0.19"

stable_deref_trait = "1.2.1"
tokio = { version = "1.53.1", features = ["sync"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
rand = "0.10.2"
rand_chacha = "0.10.0"
lazy_static = "1.5.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
serde_json = "1.0.151"

[features]
default = ["sync", "releaser", "notifier", "async"]
sync = []
releaser = []
notifier = []
async = ["tokio"]
