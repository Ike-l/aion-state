[package]
name = "aion-state"
version = "0.1.0"
edition = "2024"

[dependencies]
parking_lot = "0.12.5"
tracing = "0.1.44"
thiserror = "2.0.18"

rand = { version = "0.10.1", optional = true }
loom = { version = "0.7.2", optional = true }

[dev-dependencies]
lazy_static = "1.5.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[features]
# default = []
default = ["default-implementation"]
default-implementation = ["rand"]